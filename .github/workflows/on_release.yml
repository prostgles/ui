name: On Release
on:
  push:
    tags:
      - "v*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          VERSION=$(./scripts/get_version.sh)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release readiness
        run: ./scripts/check_release_ready.sh on-release

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ./releases/${{ github.ref_name }}.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  build_docker_images:
    timeout-minutes: 20
    needs: prepare_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Optional: Prevent other matrix jobs from being cancelled if one fails
      matrix:
        include: # Define the specific combinations you need
          - image_name: ui
            dockerfile: Dockerfile
          - image_name: ui-db
            dockerfile: DB.Dockerfile
          # Add more entries here if you have more images to build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: prostgles/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  build_linux:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build_docker_images
    if: success()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build Linux
        run: |
          sudo apt-get install rpm -y && \
          cd electron && npm run build-linux
          cd dist
          sha256sum *.* > linux.checksums
          echo linux.checksums
      - name: Release Linux
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron/dist/**/*.deb
            electron/dist/**/*.rpm
            electron/dist/**/*.AppImage
            electron/dist/**/*.checksums
  build_windows:
    timeout-minutes: 20
    needs: build_docker_images
    runs-on: windows-latest
    if: success()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build Windows
        shell: cmd
        run: |
          cd electron 
          npm run build-win
          cd dist
          for /r %%f in (*.exe) DO certutil -hashfile "%%f" SHA256 > windows.checksums
          type windows.checksums
      - name: Release Windows
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron/dist/**/*.exe
            electron/dist/**/*.checksums
  build_macos:
    timeout-minutes: 20
    needs: build_docker_images
    runs-on: macos-latest
    if: success()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build MacOS
        run: |
          cd electron 
          npm run build-macos
          rm -rf ./dist/mac-universal
          cd dist
          shasum -a 256 *.* > macos.checksums
          cat macos.checksums
      - name: Release MacOS
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron/dist/**/*.dmg
            electron/dist/**/*.checksums
  publish_release:
    needs:
      - prepare_release
      - build_docker_images
      - build_linux
      - build_windows
      - build_macos
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.prepare_release.outputs.release_id }}
